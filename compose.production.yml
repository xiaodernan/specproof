# SpecProof production compose — app services on top of the infra stack.
# Usage: docker compose -f compose.phase0.yml -f compose.production.yml up -d
# The API requires SPECPROOF_API_KEY (fail-closed authentication) and the
# worker executes untrusted repo code ONLY inside the sandbox image.
#
# §12 / DooD: the worker does NOT mount the host docker socket. It talks to
# a dedicated Docker-in-Docker daemon (the `sandbox` service) over plain TCP
# inside the compose network. That daemon is the only component that can
# start containers, and every sandbox container it starts runs --network none
# as uid 1000 (see sandbox/runner.py).

name: specproof-app

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    environment:
      # Arm storage/config_guard.py. Without SPECPROOF_ENV=production the guard
      # that refuses default credentials never runs, so a stack that forgot a
      # secret would boot against the product database with `specproof_pass`.
      # Every credential below is therefore REQUIRED (`:?`), not defaulted: the
      # infra layer (compose.phase0.yml) reads the same host variables, so a
      # value that reaches the app is also the value the servers were given.
      CRAFT_MAX_ITERATIONS: ${CRAFT_MAX_ITERATIONS:-12}
      CRAFT_MAX_STEPS: ${CRAFT_MAX_STEPS:-12}
      CRAFT_MAX_TOOL_CALLS: ${CRAFT_MAX_TOOL_CALLS:-40}
      CRAFT_TIMEOUT_MINUTES: ${CRAFT_TIMEOUT_MINUTES:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      SPECPROOF_ENV: production
      SPECPROOF_API_KEY: ${SPECPROOF_API_KEY:?set SPECPROOF_API_KEY}
      SPECPROOF_CORS_ORIGINS: ${SPECPROOF_CORS_ORIGINS:-http://localhost:3000}
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      MONGODB_HOST: mongodb
      ES_HOST: http://elasticsearch:9200
      RABBITMQ_HOST: rabbitmq
      MINIO_HOST: minio
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      ES_PASSWORD: ${ES_PASSWORD:?set ES_PASSWORD}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:?set MONGODB_PASSWORD}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      # Observability profile: ship OTel to the collector (compose.observability.yml).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      # Delivery plane (#257): every knob a module of THIS service reads and
      # .env.example advertises arrives here - as a literal the stack is pinned
      # to, or as `${X:-value}` whose fallback equals both the template row and
      # the code's own default, so a stack started WITHOUT .env behaves exactly
      # as it did before this block. Names that could not meet that test are
      # deferred with a disclosure in .env.example and pinned in
      # tests/unit/test_env_knobs_reach_the_process_that_reads_them.py.
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      LLM_THINKING_MODE: ${LLM_THINKING_MODE:-plan_only}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-specproof_phase0}
      MONGODB_USER: ${MONGODB_USER:-specproof}
      MYSQL_CONNECT_TIMEOUT: ${MYSQL_CONNECT_TIMEOUT:-5}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-specproof_phase0}
      MYSQL_READ_TIMEOUT: ${MYSQL_READ_TIMEOUT:-15}
      MYSQL_WRITE_TIMEOUT: ${MYSQL_WRITE_TIMEOUT:-15}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      RABBITMQ_USER: ${RABBITMQ_USER:-specproof}
      SPECPROOF_AUTH_ENABLED: ${SPECPROOF_AUTH_ENABLED:-}
      SPECPROOF_BCRYPT_ROUNDS: ${SPECPROOF_BCRYPT_ROUNDS:-12}
      SPECPROOF_DEFAULT_TENANT_ID: ${SPECPROOF_DEFAULT_TENANT_ID:-}
      SPECPROOF_IDENTITY_URL: ${SPECPROOF_IDENTITY_URL:-}
      SPECPROOF_OIDC_ROLE_CLAIM: ${SPECPROOF_OIDC_ROLE_CLAIM:-roles}
      SPECPROOF_OIDC_TENANT_CLAIM: ${SPECPROOF_OIDC_TENANT_CLAIM:-tenant_id}
      SPECPROOF_TOKEN_HMAC_KEY: ${SPECPROOF_TOKEN_HMAC_KEY:-}
      WORKER_PROVIDER_PARK_MAX_SECONDS: ${WORKER_PROVIDER_PARK_MAX_SECONDS:-0}
      WORKER_RECLAIM_INTERVAL_SECONDS: ${WORKER_RECLAIM_INTERVAL_SECONDS:-300}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    user: "1000:1000"
    environment:
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      SPECPROOF_ENV: production
      SPECPROOF_SANDBOX: docker
      # Containment armed (#156, user-approved): the worker pins an isolating
      # plane and touches no path outside the shared /workspaces volume (no
      # host repo bind mounts; worktrees come from TMPDIR=/workspaces). With
      # both knobs set, repo_under_allowed_root refuses any repository
      # resolving outside /workspaces and execution_mode_signal stops
      # answering "local mode: host filesystem access allowed" on a plane
      # whose whole promise is isolation. tests/unit/
      # test_repo_safety_discloses_the_unarmed_containment.py locks this
      # arming to the volume facts below — change one, re-derive the other.
      SPECPROOF_EXEC_MODE: sandbox
      SPECPROOF_ALLOWED_ROOT: /workspaces
      # Non-root cache volume (uid-1000 layout); the runner defaults to
      # the legacy root-layout volume unless this is set.
      SPECPROOF_SANDBOX_M2_VOLUME: specproof-maven-cache-1000
      # Docker CLI target: the dedicated DooD daemon (no host socket).
      # Port verified live: with DOCKER_TLS_CERTDIR="" the dind dockerd
      # binds plain TCP on 2375 (2376 is the TLS port).
      DOCKER_HOST: tcp://sandbox:2375
      # Worktrees live on a volume shared with the sandbox daemon, so the
      # paths the worker passes to `docker run -v` exist inside the daemon.
      TMPDIR: /workspaces
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      MONGODB_HOST: mongodb
      RABBITMQ_HOST: rabbitmq
      MINIO_HOST: minio
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:?set MONGODB_PASSWORD}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      ES_PASSWORD: ${ES_PASSWORD:?set ES_PASSWORD}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      # Stuck-job sweep (#71): a worker that dies mid-job leaves a
      # RUNNING row only the reclaimer can move. Every replica ticks,
      # and a Redis scope lock keeps it one sweep per interval.
      # 0 = manual `specproof ops recover` only.
      WORKER_RECLAIM_INTERVAL_SECONDS: ${WORKER_RECLAIM_INTERVAL_SECONDS:-300}
      # No model-provider health probe exists, so parked jobs are not
      # released on a timer by default (0 = never).
      WORKER_PROVIDER_PARK_MAX_SECONDS: ${WORKER_PROVIDER_PARK_MAX_SECONDS:-0}
      # Delivery plane (#257): the same rule api's block states.
      # Retrieval was dead on the deployed plane: worker modules build
      # ElasticsearchStore() from ES_HOST, only api pinned the in-network
      # endpoint, so the worker fell back to http://localhost:9200 and every
      # repository-context retrieval reported the es_unavailable outcome.
      ES_HOST: http://elasticsearch:9200
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_INSTALLATION_ID: ${GITHUB_APP_INSTALLATION_ID:-}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      LLM_THINKING_MODE: ${LLM_THINKING_MODE:-plan_only}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-specproof_phase0}
      MONGODB_USER: ${MONGODB_USER:-specproof}
      MYSQL_CONNECT_TIMEOUT: ${MYSQL_CONNECT_TIMEOUT:-5}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-specproof_phase0}
      MYSQL_READ_TIMEOUT: ${MYSQL_READ_TIMEOUT:-15}
      MYSQL_WRITE_TIMEOUT: ${MYSQL_WRITE_TIMEOUT:-15}
      RABBITMQ_USER: ${RABBITMQ_USER:-specproof}
    volumes:
      - specproof-workspaces:/workspaces
    depends_on:
      sandbox:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Outbox relay: moves MySQL outbox rows onto RabbitMQ (publisher
  # confirm, SELECT FOR UPDATE SKIP LOCKED). The production stack must
  # run it for webhook-triggered jobs to reach the worker; it also
  # exposes specproof_outbox_pending on :9101 for Prometheus
  # (compose.observability.yml scrapes outbox-relay:9101/metrics).
  outbox-relay:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    command: ["python", "-m", "storage.outbox_relay"]
    restart: unless-stopped
    environment:
      SPECPROOF_ENV: production
      MYSQL_HOST: mysql
      RABBITMQ_HOST: rabbitmq
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
      OUTBOX_RELAY_METRICS_PORT: "9101"
      # Delivery plane (#257): the same rule api's block states.
      MYSQL_CONNECT_TIMEOUT: ${MYSQL_CONNECT_TIMEOUT:-5}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-specproof_phase0}
      MYSQL_READ_TIMEOUT: ${MYSQL_READ_TIMEOUT:-15}
      MYSQL_WRITE_TIMEOUT: ${MYSQL_WRITE_TIMEOUT:-15}
      RABBITMQ_USER: ${RABBITMQ_USER:-specproof}
    expose:
      - "9101"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # DooD sandbox daemon (§12: no /var/run/docker.sock anywhere).
  # docker:dind (privileged) — this is Docker-in-Docker, NOT host-socket
  # passthrough: the worker has no access to the host daemon, and the
  # containers this daemon starts still run --network none as uid 1000.
  # Rootless variant (docker:27-dind-rootless) was tested on this host and
  # cannot work with these shared volumes: dockerd aborts with
  #   failed to start daemon: error setting up default driver:
  #   chmod /home/rootless/.local/share/docker/volumes: operation not
  #   permitted
  # (named-volume mountpoints are host-root-owned and rootless dockerd
  # cannot chown them); rootless sub-uid remapping would also make
  # inner-container files wrong-owned on the shared workspace volume.
  # See docs/operations/RUNBOOK.md for the trade-offs.
  sandbox:
    image: docker:27-dind
    restart: unless-stopped
    privileged: true
    environment:
      DOCKER_HOST: tcp://0.0.0.0:2375
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - sandbox-docker-data:/var/lib/docker
      # The named volume the sandbox containers mount must exist INSIDE
      # this daemon; bind the seeded host volume onto the daemon's own
      # volume-store path so `-v specproof-maven-cache-1000:/home/maven/.m2`
      # resolves to the pre-seeded non-root cache.
      - specproof-maven-cache-1000:/var/lib/docker/volumes/specproof-maven-cache-1000/_data
      - specproof-workspaces:/workspaces

  # #159b: the phase0 `minio` service is SeaweedFS (MinIO withdrew its
  # community images from public registries). Dev/CI run against the default
  # identity in deploy/seaweedfs/s3.json, but production requires real,
  # non-default credentials (storage/config_guard.py refuses the defaults),
  # so this override regenerates the identity file from the SAME environment
  # the app services receive — one source of truth, no server/client drift.
  # Credential charset note: the values are embedded into JSON with printf,
  # so `"` and `\` are not usable; the MinIO-style alnum convention holds.
  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    # Override the phase0 command too: compose merges lists by replace-on-
    # override only for `command` as a whole, and without this the merged
    # command still points at the mounted default s3.json, silently ignoring
    # the generated /tmp/s3.json below (measured: `docker compose config`).
    command:
      - server
      - -dir=/data
      - -master.volumeSizeLimitMB=1024
      - -volume.max=0
      - -filer
      - -s3
      - -s3.port=9000
      - -s3.config=/tmp/s3.json
      - -ip.bind=0.0.0.0
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf '{"identities":[{"name":"%s","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write"]}]}' \
          "$$MINIO_ROOT_USER" "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" > /tmp/s3.json
        exec /entrypoint.sh server -dir=/data -master.volumeSizeLimitMB=1024 -volume.max=0 -filer -s3 -s3.port=9000 -s3.config=/tmp/s3.json -ip.bind=0.0.0.0

volumes:
  # External volumes are created/owned-1000 by scripts/seed_sandbox_cache.ps1
  # before the first `docker compose up` (see docs/operations/RUNBOOK.md).
  specproof-workspaces:
    external: true
  sandbox-docker-data:
  specproof-maven-cache-1000:
    external: true
