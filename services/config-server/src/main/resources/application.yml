server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    # The native (file-backed) backend: serves YAML from the classpath below.
    # No git repository required, so the server boots offline and is testable.
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config/

management:
  endpoints:
    web:
      exposure:
        include: health,info
