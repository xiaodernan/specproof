# The edge's route table — the ONE place where "which plane answers this
# path" is written down.
#
# There are two planes behind this gateway:
#   * the control plane (Spring Boot, services/control-plane) — tenants,
#     users, the read-only job facade and the GitHub webhook;
#   * the agent runtime (Python, api/) — the product API the web UI talks to.
#
# Measured before this file existed (the gate re-measures it every run):
# the control plane owns 9 routes, the agent runtime owns 66, and exactly
# ONE path is owned by BOTH: GET /health.  Everything else is disjoint,
# but not in the way a prefix rule would think: the agent runtime's
# job sub-resources live UNDER the control plane's item path
# (/api/v1/jobs/{id}/stages under the control plane's /api/v1/jobs/{id}),
# so a gateway that routed "/api/v1/jobs" by prefix would swallow six
# routes that belong to the other plane.
#
# Rules this table follows, each one checked by
# tests/unit/test_gateway_route_table_covers_every_plane_route.py:
#   * every route of every plane is either reachable here, exactly once, or
#     declared internal-only below with a reason — nothing disappears;
#   * no route of one plane may claim a route of the other plane;
#   * the catch-all comes last, because the order of this list IS the
#     order the gateway matches in;
#   * the plane a route belongs to is written in its own metadata, and the
#     upstream URL variable must match that plane's name — a copy-paste
#     that points a control-plane route at the agent runtime is red.
#
# What this file deliberately does NOT do: register the planes in a service
# registry (Eureka), rewrite paths, or split the product into more
# deployment units.  One edge, two upstreams, one readable table.

server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    # the OTel resource name defaults to this; the compose observability
    # stack keys on OTEL_SERVICE_NAME=specproof-gateway
    name: specproof-gateway
  cloud:
    gateway:
      # The edge must give up on a hung upstream before its callers do — an
      # upstream that accepts the connection and never answers otherwise
      # ties up the edge, the thread and the caller that is waiting on it.
      # `response-timeout` bounds the time to the FIRST response byte; it
      # does NOT cap an open stream — GET /agent/jobs/{id}/events (SSE)
      # pushes progress forever, and bounding it would sever the live
      # feed the web UI renders. That is exactly the death the breaker
      # below cannot see either (it counts FAILURES; a hang is not one
      # until it errors). Spring Cloud Gateway has NO default for this
      # property, so an unset value means "wait forever" — which is what
      # this block exists to stop.
      httpclient:
        connect-timeout: 5000        # ms; the planes are on the same network
        response-timeout: 30s
        # Publish the upstream connection pool to micrometer (reactor-netty
        # pool metrics). The edge already scrapes this port into Prometheus;
        # without these series, "the agent runtime is slow" and "the edge's
        # pool is saturated" look identical on the dashboard, and only one
        # of them is actionable.
        pool:
          metrics: true
        # The gateway's own route metrics (prefix spring.cloud.gateway):
        # per-route latency and count, tagged by route_id. Same reason as the
        # pool: the management port is already scraped, but without this the
        # edge is a black box between its two planes — you cannot tell which
        # plane a slow request is stuck on, only that requests are slow.
        metrics:
          enabled: true
      routes:
        # ── the control plane's routes ─────────────────────────────────────
        # /api/v1/jobs (collection) and /api/v1/jobs/{id} (one job).  The
        # agent runtime's job sub-resources sit one segment deeper
        # (/api/v1/jobs/{id}/stages and friends), so {id} — which matches
        # exactly one segment — leaves them alone.
        # The control plane has its own breaker (#1597): an agent-runtime
        # breaker must not flip for a control-plane failure and vice versa,
        # and a hung control plane must not tie up edge threads until the
        # 30s transport timeout fires every time.
        - id: control-plane-jobs
          uri: ${SPECPROOF_CONTROL_PLANE_URL:http://control-plane:8081}
          metadata:
            plane: control-plane
          predicates:
            - Path=/api/v1/jobs,/api/v1/jobs/{id}
            - Method=GET
          filters:
            - EdgeCircuitBreaker=specproof-control-plane
            # Retry is GET-only so failures to the write paths (tenants POST,
            # webhook POST) are never duplicated; 5XX-only statuses so the
            # breaker-generated 503 (an intentional refusal) is never retried;
            # short backoff so a transient blip does not compound into a
            # queue-building retry storm.
            - name: Retry
              args:
                retries: 2
                statuses: INTERNAL_SERVER_ERROR
                methods: GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2

        # The tenant collection is written (POST) and read (GET).
        - id: control-plane-tenants
          uri: ${SPECPROOF_CONTROL_PLANE_URL:http://control-plane:8081}
          metadata:
            plane: control-plane
          predicates:
            - Path=/api/v1/tenants
            - Method=GET,POST
          filters:
            - EdgeCircuitBreaker=specproof-control-plane
            # GET-only for the same reason as control-plane-jobs: tenants
            # POST is a mutating call and must never be retried by the edge.
            - name: Retry
              args:
                retries: 2
                statuses: INTERNAL_SERVER_ERROR
                methods: GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2

        # One tenant is read-only here; there is no PUT/DELETE for a tenant
        # in the control plane yet, so this route does not claim one.
        - id: control-plane-tenant-item
          uri: ${SPECPROOF_CONTROL_PLANE_URL:http://control-plane:8081}
          metadata:
            plane: control-plane
          predicates:
            - Path=/api/v1/tenants/{id}
            - Method=GET
          filters:
            - EdgeCircuitBreaker=specproof-control-plane
            # GET-only: read retries are cheap and idempotent; this is the
            # endpoint the web UI hits on every tenant panel render.
            - name: Retry
              args:
                retries: 2
                statuses: INTERNAL_SERVER_ERROR
                methods: GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2

        - id: control-plane-tenant-users
          uri: ${SPECPROOF_CONTROL_PLANE_URL:http://control-plane:8081}
          metadata:
            plane: control-plane
          predicates:
            - Path=/api/v1/tenants/{tenantId}/users
            - Method=GET,POST
          filters:
            - EdgeCircuitBreaker=specproof-control-plane
            # GET-only for the same reason as tenants: POST creates a user
            # and must not be duplicated by the edge.
            - name: Retry
              args:
                retries: 2
                statuses: INTERNAL_SERVER_ERROR
                methods: GET
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2

        - id: control-plane-github-webhook
          uri: ${SPECPROOF_CONTROL_PLANE_URL:http://control-plane:8081}
          metadata:
            plane: control-plane
          predicates:
            - Path=/api/v1/webhooks/github
            - Method=POST
          filters:
            - EdgeCircuitBreaker=specproof-control-plane

        # ── the agent runtime owns everything else ─────────────────────────
        # LAST on purpose: this is the catch-all, and the order of the list
        # is the order the gateway matches in.  It points at the agent
        # runtime, so every path the control plane did not claim goes to
        # the plane that has always answered it — including GET /health,
        # which the agent runtime has answered since before the edge
        # existed.  The agent runtime's own router keeps the order of its
        # own routes (its SPA fallback is registered last and refuses the
        # reserved prefixes), so nothing here has to know about them.
        - id: agent-runtime-default
          uri: ${SPECPROOF_AGENT_RUNTIME_URL:http://api:8000}
          metadata:
            plane: agent-runtime
          predicates:
            - Path=/**
          filters:
            # The edge sheds load before it touches the upstream: a token
            # bucket of 50 permits per second on the catch-all. 429 (not
            # 503): the caller is being told to slow down, not that the
            # upstream is broken. Count lives in YAML next to the route.
            - name: EdgeRateLimiter
              args:
                name: specproof-edge-public
                limitForPeriod: 50
                limitRefreshPeriod: PT1S
                timeoutDuration: PT0S
            - EdgeCircuitBreaker=specproof-edge

# OTel: OTLP -> the shared OpenTelemetry collector when the operator sets
# OTEL_SDK_DISABLED=false (and, implicitly, OTEL_EXPORTER_OTLP_ENDPOINT).
# The compose observability profile runs an otel-collector; docker run and the
# cold-start evidence are an operator decision, not an assumed default — an
# edge that cannot reach a collector still boots perfectly with the SDK
# disabled.
otel:
  sdk:
    disabled: ${OTEL_SDK_DISABLED:true}
  service:
    name: ${OTEL_SERVICE_NAME:specproof-gateway}
  traces:
    sampler: ${OTEL_TRACES_SAMPLER:parentbased_always_on}
    sampler-arg: ${OTEL_TRACES_SAMPLER_ARG:1.0}

# resilience4j: the edge's upstream circuit breakers. Two instances — one per
# plane — so a hung control plane does not flip the breaker the agent
# runtime relies on (or vice versa); an operator sees two independent
# gauges/`circuitbreaker_state{name="specproof-*"}` series, not one blurred
# aggregate.
resilience4j:
  circuitbreaker:
    # spring-boot binds its own metrics when this is set; without it,
    # resilience4j only emits events and /actuator/prometheus has no
    # circuitbreaker_* series to scrape.
    metrics:
      enabled: true
    instances:
      # the catch-all (agent runtime) — the public product API; more calls
      specproof-edge:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
      # the control plane (read facade + webhook + jobs projections);
      # smaller traffic, same shape — no need for a different knob here
      specproof-control-plane:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

specproof:
  gateway:
    # Routes that are deliberately NOT served at the edge.  A route that is
    # neither here nor claimed by a route above would be a route that
    # vanished; the gate refuses to let that happen silently.
    internal-only:
      - plane: control-plane
        method: GET
        path: /health
        reason: >-
          the control plane's probe is a cluster-internal fact — its compose
          healthcheck and its load balancer ask the service directly.  At the
          edge GET /health is the agent runtime's readiness, and it has been
          since before the edge existed; the two payloads are different facts
          (the agent runtime reports the stores that gate job execution, the
          control plane reports {"service": "specproof-control-plane",
          "status": "ok"}), so one of them must not answer for the other.

management:
  server:
    # The management endpoints live on their OWN port, bound to loopback by
    # default. On the edge port the actuator would publish the upstream
    # topology (the route table names each plane's internal URL), and the
    # edge is the public face of the product.
    #
    # Compose observability stack is the one deliberate exception: its
    # Prometheus scrapes this port from a sibling container on the same
    # network, which loopback cannot serve, so compose.observability.yml sets
    # GATEWAY_MANAGEMENT_ADDRESS=0.0.0.0 for specproof-edge and binds nothing
    # beyond the internal network.
    port: ${GATEWAY_MANAGEMENT_PORT:8090}
    address: ${GATEWAY_MANAGEMENT_ADDRESS:127.0.0.1}
  metrics:
    distribution:
      # The Spring Cloud Gateway route timer publishes histogram buckets, so
      # Prometheus can compute per-route p50/p95 with histogram_quantile.
      # Without this the timer exports only _count/_sum/_max and any per-route
      # percentile is a number nobody has.
      percentiles-histogram:
        spring.cloud.gateway.requests: true
  prometheus:
    metrics:
      export:
        # Boot 3.x does NOT export metrics by default — with this absent,
        # the PrometheusMeterRegistry bean never exists and
        # /actuator/prometheus falls through to the catch-all route, the
        # agent-runtime answers for it, and Prometheus would scrape
        # ""ok"" from the upstream instead of the edge's series.
        enabled: true
  endpoints:
    web:
      exposure:
        # gateway: the route table as the gateway itself sees it — the
        # runtime reading of the file the gate reads statically.
        # prometheus: the EdgeCircuitBreaker's gauges/counters so the
        # container-ops stack can scrape them (loopback only, like the
        # rest of the management surface).
        include: health,info,gateway,prometheus
  endpoint:
    gateway:
      enabled: true
