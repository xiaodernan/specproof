spring:
  application:
    name: specproof-control-plane
  data:
    redis:
      # The cache's safety argument rests on these two numbers
      # (RedisJobReadCache's javadoc says so in as many words): EVERY call to
      # the backend must be bounded, so a dead Redis costs one round trip
      # instead of the socket default. Spring's default command timeout is
      # 60s -- five consecutive failures at that cost hold five request
      # threads for five minutes, which is the outage the breaker was added
      # to prevent. So the bound is DECLARED here, not hoped for.
      #
      # 50ms is the deployment's budget: the cache answers "I have nothing"
      # and the caller reads the database, so the round trip only has to be
      # cheaper than the database read it saves.
      timeout: ${REDIS_COMMAND_TIMEOUT:50ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:50ms}
  config:
    # The shared config server (services/config-server): optional by
    # construction — a control plane that cannot reach it must still boot
    # with the values in this file, exactly like the edge does. The word
    # "optional" is the whole contract; a mandatory import would turn a
    # config server outage into a fleet outage.
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:specproof_phase0}?useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:specproof}
    password: ${MYSQL_PASSWORD:specproof_pass}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:specproof}
    password: ${RABBITMQ_PASSWORD:specproof_pass}
    publisher-confirm-type: correlated

server:
  port: ${CONTROL_PLANE_PORT:8081}

specproof:
  github:
    # Fail-closed: webhooks are refused (503) while this is empty.
    webhook-secret: ${GITHUB_WEBHOOK_SECRET:}
  outbox:
    relay-enabled: ${SPECPROOF_CP_OUTBOX_RELAY:true}
    relay-interval-ms: ${SPECPROOF_CP_OUTBOX_RELAY_INTERVAL_MS:1000}
    exchange: specproof.p1.commands
    batch-size: 10

# The same registry the edge uses (services/discovery-server, #1608): the
# control plane registers itself next to the edge so an operator can see
# the whole cluster in one place. A downed registry is NOT fatal — the
# client retries in the background — which
# ControlPlaneOfflineResilienceTests pins (the edge has the same contract
# in GatewayOfflineResilienceTests).
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  prometheus:
    metrics:
      export:
        # Boot 3.x does NOT export metrics by default — with this absent the
        # PrometheusMeterRegistry bean never exists and /actuator/prometheus
        # answers 404 (the include list names the endpoint, but Boot's
        # registry decides whether it's real). Mirrors the edge's wiring;
        # the scrape job is still the operator's call (RUNBOOK §5), this only
        # makes the endpoint exist so a future scrape target has something to
        # reach. Wired by ControlPlanePrometheusEndpointTests.
        enabled: true
  endpoints:
    web:
      exposure:
        # health/info/metrics were listed before actuator was on the
        # classpath (the section was silently ignored); spring-boot-starter-
        # actuator + micrometer-registry-prometheus are now real dependencies,
        # so this list binds. prometheus is NOT yet scraped anywhere —
        # compose does not arm the control-plane (RUNBOOK: 另开, 共享同一
        # MySQL), so adding a scrape target here would mint a target no deploy
        # file backs; enabling it is one scrape job + one alert, and it is
        # the operator's call.
        # refresh is the Spring Cloud refresh endpoint (spring-cloud-context
        # is on the classpath via spring-cloud-starter-config): POST it after
        # a config-server push to reload the @ConfigurationProperties /
        # @RefreshScope state in place. Exposing it is the whole delivery
        # mechanism for the refresh witness — no broker, no new jar.
        include: health,info,metrics,prometheus,refresh
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
