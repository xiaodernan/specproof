# Do not let anything that answers at localhost:8888 leak into this suite.
# A stale config-server container (health,info exposure) previously shadowed
# the control-plane's prometheus/refresh endpoints. Artefact of THIS host:
# pin the import at a discard port; optional = silently ignored.
spring:
  cloud:
    config:
      enabled: false
      import: optional:configserver:http://127.0.0.1:9/
  sql:
    init:
      mode: never
  datasource:
    url: jdbc:h2:mem:controlplane;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

specproof:
  github:
    webhook-secret: test-webhook-secret
  outbox:
    relay-enabled: false
  control-plane:
    job-cache:
      # Tests run without a Redis; the in-memory backend honours the same
      # contract (TTL, LRU, fail-open) the Redis path is tested against.
      backend: memory
# The stale container on localhost:8888 serves
# management.endpoints.web.exposure.include=health,info,
# which masks the prometheus and refresh endpoints in every context that loads
# the Boot 3 native config-data import (the Legacy spring.cloud.config.enabled=false
# does not gate it). Pin the exposure list here in the test profile, mirroring
# the production application.yml exactly.
management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,refresh
