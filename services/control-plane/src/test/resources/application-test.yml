spring:
  sql:
    init:
      mode: never
  datasource:
    url: jdbc:h2:mem:controlplane;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

specproof:
  github:
    webhook-secret: test-webhook-secret
  outbox:
    relay-enabled: false
