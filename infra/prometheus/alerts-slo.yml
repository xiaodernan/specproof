# SpecProof SLO 告警规则 (PRODUCTION_SPEC §14 可自动化部分)
#
# 阈值变量化说明: Prometheus 规则文件不支持模板变量, 所有阈值集中在本文件
# 顶部的 THRESHOLDS 表中, 调整只需改对应规则的 expr/for (单一修改点)。
#
# THRESHOLDS (出处: docs/PRODUCTION_SPEC.txt §14 "SLO 与生产质量")
#   OUTBOX_PENDING_THRESHOLD = 50     ← §14 可用性 "Job 不丢失: Outbox + MQ + 幂等"
#                                        积压 50 条 = 丢失/延迟前兆, for 5m
#   API_5XX_RATE_THRESHOLD   = 0.05   ← §14 可用性 "Control Plane 月可用性 99.5%"
#                                        5 分钟窗口内 5xx 占比 > 5% 即告警
#   WORKER_FAIL_RATE_THRESHOLD = 0.30 ← §14 质量目标 (BLOCKER/MAJOR Precision >= 90%,
#                                        Capsule Replay >= 95% 的前置条件)
#                                        15 分钟窗口内失败率 > 30% 触发排查
#   JOB_P95_FAST_SECONDS     = 480    ← §14 性能 "FAST 小 PR p95 <= 8 分钟"
#   JOB_P95_DEEP_SECONDS     = 1500   ← §14 性能 "DEEP 小 PR p95 <= 25 分钟"
#                                        (#161 起直方图按 depth 拆名
#                                        jobs_duration_seconds_<depth>,
#                                        FAST/DEEP 各用各的阈值分别告警;
#                                        队列入口当前仅收 FAST — POST /jobs
#                                        钉 ^FAST$、MCP 同、webhook 硬编码,
#                                        DEEP 通道先 armed, 入队那天自动生效)
#   WEBHOOK_P95_SECONDS      = 1      ← §14 "GitHub Webhook 响应: p95 <= 1 秒"
#                                        (#162 起接线, 亚秒桶梯度 0.05..2.5;
#                                        默认梯度首格 60s, 对 1s 分位数无分辨率)

groups:
  - name: specproof-slo
    rules:
      # ── 目标 down (§14 可用性) ──────────────────────────────────────
      - alert: SpecproofApiDown
        expr: up{job="api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "SpecProof API 抓取目标 down"
          description: "{{ $labels.instance }} 已 {{ $value }} 超过 1 分钟 (§14: Control Plane 月可用性 99.5%)。"

      - alert: SpecproofWorkerDown
        expr: up{job="worker"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SpecProof worker 抓取目标 down"
          description: "{{ $labels.instance }} 超过 5 分钟不可抓取 (§14: Job 不丢失依赖 worker 消费)。"

      - alert: SpecproofOutboxRelayDown
        expr: up{job="outbox-relay"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SpecProof outbox relay 抓取目标 down"
          description: "{{ $labels.instance }} 超过 5 分钟不可抓取 (§14: Job 不丢失依赖 Outbox 投递)。"

      # ── Outbox 积压 (§14 可用性: Job 不丢失) ────────────────────────
      - alert: SpecproofOutboxBacklogHigh
        expr: specproof_outbox_pending > 50
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "SpecProof outbox 积压超过阈值 (OUTBOX_PENDING_THRESHOLD=50)"
          description: "outbox 未投递事件 {{ $value }} 条, 持续 5 分钟 (§14: Job 不丢失 — 积压是丢失/重复风险前兆)。"

      # ── API 5xx 率 (§14 可用性 99.5%) ──────────────────────────────
      - alert: SpecproofApiHigh5xxRate
        expr: >
          (
            sum(rate(specproof_http_responses_5xx_total[5m]))
            /
            clamp_min(sum(rate(specproof_http_requests_total[5m])), 1e-9)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SpecProof API 5xx 率超过阈值 (API_5XX_RATE_THRESHOLD=0.05)"
          description: "5 分钟窗口 5xx 占比 {{ $value | humanizePercentage }} (§14: Control Plane 月可用性 99.5%)。"

      # ── worker 失败率 (§14 质量目标) ────────────────────────────────
      - alert: SpecproofWorkerFailureRateHigh
        expr: >
          (
            sum(increase(specproof_jobs_failed_total[15m]))
            /
            clamp_min(sum(increase(specproof_jobs_completed_total[15m])), 1)
          ) > 0.30
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "SpecProof job 失败率超过阈值 (WORKER_FAIL_RATE_THRESHOLD=0.30)"
          description: "15 分钟窗口内失败/完成比 {{ $value | humanizePercentage }} (§14 质量目标 Precision/Replay 的前置健康条件)。"

      # ── Job 时长 p95 (§14 性能目标, 按 depth 分档) ──────────────────
      - alert: SpecproofJobDurationP95FastHigh
        expr: >
          histogram_quantile(
            0.95,
            sum(rate(specproof_jobs_duration_seconds_fast_bucket[30m])) by (le)
          ) > 480
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "SpecProof FAST job 时长 p95 超过阈值 (JOB_P95_FAST_SECONDS=480)"
          description: "30 分钟窗口 FAST p95 = {{ $value }}s (§14: FAST 小 PR p95 <= 8 分钟)。"

      - alert: SpecproofJobDurationP95DeepHigh
        expr: >
          histogram_quantile(
            0.95,
            sum(rate(specproof_jobs_duration_seconds_deep_bucket[30m])) by (le)
          ) > 1500
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "SpecProof DEEP job 时长 p95 超过阈值 (JOB_P95_DEEP_SECONDS=1500)"
          description: "30 分钟窗口 DEEP p95 = {{ $value }}s (§14: DEEP 小 PR p95 <= 25 分钟)。队列入口当前仅收 FAST, 本告警在 DEEP 入队前不会有数据 (armed)。"

      # ── GitHub Webhook 响应 p95 (§14 性能目标) ──────────────────────
      - alert: SpecproofWebhookDurationP95High
        expr: >
          histogram_quantile(
            0.95,
            sum(rate(specproof_webhook_github_handling_seconds_bucket[10m])) by (le)
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SpecProof GitHub webhook 响应 p95 超过阈值 (WEBHOOK_P95_SECONDS=1)"
          description: "10 分钟窗口 webhook 响应 p95 = {{ $value }}s (§14: GitHub Webhook 响应 p95 <= 1 秒; 亚秒桶梯度, 含 4xx/5xx 响应)。"
