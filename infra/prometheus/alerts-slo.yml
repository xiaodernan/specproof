# SpecProof SLO 告警规则 (PRODUCTION_SPEC §14 可自动化部分)
#
# 阈值变量化说明: Prometheus 规则文件不支持模板变量, 所有阈值集中在本文件
# 顶部的 THRESHOLDS 表里登记; 但每条规则仍要在自己的 expr 里写字面量, 并在
# summary 的 (VAR=value) 槽里复述一次——同一个阈值在本文件有三份, 改一处必然
# 让另外两处说谎。#219 的门
# (tests/unit/test_alert_rules_bind_their_own_threshold_table.py) 把三份钉在
# 一起: 不一致时拒绝, 所以 retune 必须一次改齐 (看板绘制值与 OBS §5 行另有
# #218/#216 两道门同批拒绝)。
#
# THRESHOLDS (出处: docs/PRODUCTION_SPEC.txt §14 "SLO 与生产质量")
#   OUTBOX_PENDING_THRESHOLD = 50     ← §14 可用性 "Job 不丢失: Outbox + MQ + 幂等"
#                                        积压 50 条 = 丢失/延迟前兆, for 5m
#   API_5XX_RATE_THRESHOLD   = 0.05   ← §14 可用性 "Control Plane 月可用性 99.5%"
#                                        5 分钟窗口内 5xx 占比 > 5% 即告警
#   WORKER_FAIL_RATE_THRESHOLD = 0.30 ← §14 质量目标 (BLOCKER/MAJOR Precision >= 90%,
#                                        Capsule Replay >= 95% 的前置条件)
#                                        15 分钟窗口内失败率 > 30% 触发排查
#   JOB_P95_FAST_SECONDS     = 480    ← §14 性能 "FAST 小 PR p95 <= 8 分钟"
#   JOB_P95_DEEP_SECONDS     = 1500   ← §14 性能 "DEEP 小 PR p95 <= 25 分钟"
#                                        (#161 起直方图按 depth 拆名
#                                        jobs_duration_seconds_<depth>,
#                                        FAST/DEEP 各用各的阈值分别告警;
#                                        队列入口当前仅收 FAST — POST /jobs
#                                        钉 ^FAST$、MCP 同、webhook 硬编码,
#                                        DEEP 通道先 armed, 入队那天自动生效)
#   WEBHOOK_P95_SECONDS      = 1      ← §14 "GitHub Webhook 响应: p95 <= 1 秒"
#                                        (#162 起接线, 亚秒桶梯度 0.05..2.5;
#                                        默认梯度首格 60s, 对 1s 分位数无分辨率)
#   RECLAIM_TICK_STALE_SECONDS = 900  ← §14 "Worker 崩溃后可恢复" (#163 起接线)
#                                        回收 tick 3 个默认周期 (3×300s) 没
#                                        跑完过一轮 = 卡死作业无人收;
#                                        worker 进程 down 告警抓不到
#                                        "进程活着但 tick 死了" 的形态
#   DASHBOARD_PROGRESS_P95_SECONDS = 2
#                                     ← §14 "Dashboard 进度延迟 <= 2s"
#                                        (#164 起接线, 事件写入→SSE 发出的
#                                        驻留时长 p95; 亚秒首格梯度 0.05..5,
#                                        2s 上界在梯度内部分辨率才存在)
#   VERIFY_QUEUE_BACKLOG_THRESHOLD = 50
#                                     ← §14 "Job 不丢失" 的 MQ 侧 (#165 起)
#                                        broker ready 深度合计 > 50 持续 10m =
#                                        消费端停摆 (Outbox 侧积压由
#                                        OUTBOX_PENDING_THRESHOLD 覆盖 — 两侧
#                                        各自可涨, 一侧健康不代表另一侧通)
#   VERIFY_DLQ_THRESHOLD = 0          ← §14 "Job 不丢失" 死信 (#165 起)
#                                        DLQ 非空即告警, 阈值内联在 expr
#                                        (> 0 for 5m) — 死信是消费被拒且
#                                        不再回炉的作业, 不会自己消失
#   NO_EVIDENCE_SEVERE_COMMENT_THRESHOLD = 0
#                                     ← §14 质量目标 "无证据严重评论 = 0"
#                                        (#182 起接线) build_review_comments
#                                        拒发缺证据的 BLOCKER/MAJOR 评论并
#                                        计数, 阈值内联在 expr (> 0 for 1m)
#                                        — 计数器只增不减, 一次违规永久可见
#   REPLAY_RATE_THRESHOLD = 0.95      ← §14 质量目标 "Capsule Replay >= 95%"
#                                        (#183 起接线) 15m 窗口
#                                        verdict_regression_confirmed/runs
#                                        成功率 < 95% 告警; verdict 词表 =
#                                        run.sh 模板四词 (create_capsule
#                                        同源, 对账门 import 钉死)

groups:
  - name: specproof-slo
    rules:
      # ── 目标 down (§14 可用性) ──────────────────────────────────────
      - alert: SpecproofApiDown
        expr: up{job="api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "SpecProof API 抓取目标 down"
          description: "{{ $labels.instance }} 已 {{ $value }} 超过 1 分钟 (§14: Control Plane 月可用性 99.5%)。"

      - alert: SpecproofWorkerDown
        expr: up{job="worker"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SpecProof worker 抓取目标 down"
          description: "{{ $labels.instance }} 超过 5 分钟不可抓取 (§14: Job 不丢失依赖 worker 消费)。"

      - alert: SpecproofOutboxRelayDown
        expr: up{job="outbox-relay"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SpecProof outbox relay 抓取目标 down"
          description: "{{ $labels.instance }} 超过 5 分钟不可抓取 (§14: Job 不丢失依赖 Outbox 投递)。"

      # ── Outbox 积压 (§14 可用性: Job 不丢失) ────────────────────────
      - alert: SpecproofOutboxBacklogHigh
        expr: specproof_outbox_pending > 50
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "SpecProof outbox 积压超过阈值 (OUTBOX_PENDING_THRESHOLD=50)"
          description: "outbox 未投递事件 {{ $value }} 条, 持续 5 分钟 (§14: Job 不丢失 — 积压是丢失/重复风险前兆)。"

      # ── API 5xx 率 (§14 可用性 99.5%) ──────────────────────────────
      - alert: SpecproofApiHigh5xxRate
        expr: >
          (
            sum(rate(specproof_http_responses_5xx_total[5m]))
            /
            clamp_min(sum(rate(specproof_http_requests_total[5m])), 1e-9)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SpecProof API 5xx 率超过阈值 (API_5XX_RATE_THRESHOLD=0.05)"
          description: "5 分钟窗口 5xx 占比 {{ $value | humanizePercentage }} (§14: Control Plane 月可用性 99.5%)。"

      # ── worker 失败率 (§14 质量目标) ────────────────────────────────
      - alert: SpecproofWorkerFailureRateHigh
        expr: >
          (
            sum(increase(specproof_jobs_failed_total[15m]))
            /
            clamp_min(sum(increase(specproof_jobs_completed_total[15m])), 1)
          ) > 0.30
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "SpecProof job 失败率超过阈值 (WORKER_FAIL_RATE_THRESHOLD=0.30)"
          description: "15 分钟窗口内失败/完成比 {{ $value | humanizePercentage }} (§14 质量目标 Precision/Replay 的前置健康条件)。"

      # ── Job 时长 p95 (§14 性能目标, 按 depth 分档) ──────────────────
      - alert: SpecproofJobDurationP95FastHigh
        expr: >
          histogram_quantile(
            0.95,
            sum(rate(specproof_jobs_duration_seconds_fast_bucket[30m])) by (le)
          ) > 480
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "SpecProof FAST job 时长 p95 超过阈值 (JOB_P95_FAST_SECONDS=480)"
          description: "30 分钟窗口 FAST p95 = {{ $value }}s (§14: FAST 小 PR p95 <= 8 分钟)。"

      - alert: SpecproofJobDurationP95DeepHigh
        expr: >
          histogram_quantile(
            0.95,
            sum(rate(specproof_jobs_duration_seconds_deep_bucket[30m])) by (le)
          ) > 1500
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "SpecProof DEEP job 时长 p95 超过阈值 (JOB_P95_DEEP_SECONDS=1500)"
          description: "30 分钟窗口 DEEP p95 = {{ $value }}s (§14: DEEP 小 PR p95 <= 25 分钟)。队列入口当前仅收 FAST, 本告警在 DEEP 入队前不会有数据 (armed)。"

      # ── GitHub Webhook 响应 p95 (§14 性能目标) ──────────────────────
      - alert: SpecproofWebhookDurationP95High
        expr: >
          histogram_quantile(
            0.95,
            sum(rate(specproof_webhook_github_handling_seconds_bucket[10m])) by (le)
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SpecProof GitHub webhook 响应 p95 超过阈值 (WEBHOOK_P95_SECONDS=1)"
          description: "10 分钟窗口 webhook 响应 p95 = {{ $value }}s (§14: GitHub Webhook 响应 p95 <= 1 秒; 亚秒桶梯度, 含 4xx/5xx 响应)。"

      # ── 回收 tick 停摆 (§14 可用性: Worker 崩溃后可恢复, #163) ──────
      - alert: SpecproofWorkerReclaimTickStale
        expr: >
          time() - specproof_worker_reclaim_last_ok_timestamp_seconds > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SpecProof 回收 tick 超过阈值没跑完一轮 (RECLAIM_TICK_STALE_SECONDS=900)"
          description: "上一轮完整回收扫描距今 {{ $value }}s (§14: Worker 崩溃后可恢复 — 卡死的 RUNNING 作业只有回收器能收回, tick 停摆后它们永远滞留)。进程活着但 tick 死了是 up 告警抓不到的形态。gauge 语义是舰队级: 任一副本的 tick 跑完一轮都会刷新它, 所以本告警含义是「没有任何一个 sweeper 活着」; 所有副本全灭的场景由 SpecproofWorkerDown 覆盖。worker 刚启动、首轮 pass 未跑前 gauge 不存在, 本表达式无序列不触发 (由 up 告警补位)。"

      # ── Dashboard 进度延迟 (§14 体验目标, #164) ─────────────────────
      - alert: SpecproofDashboardProgressLagHigh
        expr: >
          histogram_quantile(
            0.95,
            sum(rate(specproof_dashboard_progress_delivery_lag_seconds_bucket[10m])) by (le)
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SpecProof 进度事件驻留 p95 超过阈值 (DASHBOARD_PROGRESS_P95_SECONDS=2)"
          description: "10 分钟窗口内进度事件从写入 Redis 到 SSE 发出的驻留 p95 = {{ $value }}s (§14: Dashboard 进度延迟 <= 2 秒)。只测 live 投递; SSE 轮询间隔 0.5s 是该时钟的下限。发出→浏览器渲染的网络/前端段无服务端观测点, 不在本告警内。"

      # ── MQ 队列深度/死信 (§14 可用性: Job 不丢失 — broker 侧, #165) ─
      # 数据源是 rabbitmq 自带插件的 per-object 渲染 (prometheus.yml 的
      # rabbitmq 抓取任务, metrics_path=/metrics/per-object); rabbitmq_*
      # 是第三方指标, 不在本仓 specproof_* 对账门管辖内。队列命名规则
      # (q.<lane> 与 dlq 后缀) 来自 storage/rabbitmq.py 的 dlq_suffix='.dlq'。
      - alert: SpecproofVerifyQueueBacklogHigh
        expr: sum(rabbitmq_queue_messages_ready{vhost="/"}) > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SpecProof MQ 队列 ready 积压超过阈值 (VERIFY_QUEUE_BACKLOG_THRESHOLD=50)"
          description: "broker ready 消息合计 {{ $value }} 条, 持续 10 分钟 (§14: Job 不丢失 — 消费端停摆时 broker 深度是唯一还在涨的信号; worker 崩溃后靠回收器收回, 但回收器同样要能跑起来)。生产者侧积压由 SpecproofOutboxBacklogHigh 覆盖, 两侧互不替代。"

      - alert: SpecproofVerifyDlqNonEmpty
        expr: 'rabbitmq_queue_messages{vhost="/",queue=~"q\\..+\\.dlq"} > 0'
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SpecProof 死信队列非空 (VERIFY_DLQ_THRESHOLD=0)"
          description: "队列 {{ $labels.queue }} 有 {{ $value }} 条死信 (§14: Job 不丢失 — 死信是消费被拒且重试耗尽的作业, 不会自己消失, 需人工回炉或归档)。队列名按 storage/rabbitmq.py 的 dlq_suffix='.dlq' 规则匹配, 覆盖全部车道的死信而不只 verify。"

      # ── 无证据严重评论 (§14 质量目标, #182) ─────────────────────────
      # 证据门禁的计数化: build_review_comments (integrations/inline_comments.py)
      # 拒发缺 evidence_type 的 BLOCKER/MAJOR 评论并计数 — SLO 是计数器
      # 保持 0; 计数器只增不减, 一次违规即永久可见。门禁在起作用
      # (评论没发出去) 但门禁被触达本身说明上游产出了无证据的严重 finding。
      - alert: SpecproofNoEvidenceSevereComment
        expr: 'specproof_severe_comments_without_evidence_total > 0'
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "SpecProof 出现无证据的严重评论 (NO_EVIDENCE_SEVERE_COMMENT_THRESHOLD=0)"
          description: "证据门禁拦下了 {{ $value }} 条缺 evidence_type 的 BLOCKER/MAJOR 评论 (§14: 无证据严重评论 = 0) — 评论已拒发, 但需排查上游为何产出无证据的严重 finding。"

      # ── Capsule Replay 成功率 (§14 质量目标, #183) ──────────────────
      # 成功率 = 15m 窗口 confirmed/runs 的 rate 比 (verdict 词族 vs. 到达
      # 沙箱的执行总数)。unexpected_fix/ambiguous/exec_errors/超时全部算
      # 失败侧。无 replay 请求时序列不存在, 本表达式无序列不触发 —
      # 没人用不是质量违规, 用了才谈得上成功率。
      - alert: SpecproofCapsuleReplayRateLow
        expr: >
          (
            1
            -
            (
              sum(rate(specproof_capsule_replay_verdict_regression_confirmed_total[15m]))
              /
              clamp_min(sum(rate(specproof_capsule_replay_runs_total[15m])), 0.001)
            )
          ) > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "SpecProof Capsule Replay 成功率低于阈值 (REPLAY_RATE_THRESHOLD=0.95)"
          description: "15 分钟窗口 replay 成功率 {{ $value | humanizePercentage }} (§14: Capsule Replay >= 95%)。成功 = run.sh stdout 判定 regression_confirmed (沙箱跑完且 exit 0 才解析); unexpected_fix / ambiguous / 执行错误 / 超时都算失败侧。"
