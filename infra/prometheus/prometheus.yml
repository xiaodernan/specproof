# SpecProof Prometheus (PRODUCTION_SPEC §17 Observability Profile)
#
# 抓取目标 (10 个 job 与下面的清单由 #220 的门逐条对账; 除 prometheus 自身抓
# localhost:9090 与单机自托管直连 192.168.1.5:8000 之外全部为服务名 DNS,
# 依赖与 api/worker 同 compose 网络; 见 compose.observability.yml 注释):
#   api:8000/metrics            ← FastAPI /metrics (api/metrics.py → observability/metrics.py)
#   worker:9100/metrics         ← worker 进程内 /metrics (observability/metrics_http.py, WORKER_METRICS_PORT)
#   outbox-relay:9101/metrics   ← outbox relay 进程内 /metrics (OUTBOX_RELAY_METRICS_PORT; 应用栈部署 relay 服务后生效)
#   notify-relay:9102/metrics   ← notify relay 进程内 /metrics (NOTIFY_RELAY_METRICS_PORT; 应用栈部署 notify-relay 服务后生效)
#   invoice-cron:9103/metrics   ← invoice cron 进程内 /metrics (INVOICE_CRON_METRICS_PORT; 仅 billing profile 启用后生效, 否则 down)
#   otel-collector:8889/metrics ← OTel Collector 内嵌 prometheus exporter
#   rabbitmq:15692/metrics/per-object ← rabbitmq_prometheus 插件的每队列渲染
#   specproof-edge:8090/actuator/prometheus   ← 边缘网关 management 端口
#   localhost:9090/metrics      ← Prometheus 自身
#   192.168.1.5:8000/metrics    ← 单机自托管直连（2026-11-16 实测入册 #1843）：本机 app 进程 `python -m api.server`，
#                                 宿主 LAN IP（loopback 与 host.docker.internal 指向的地址都被另一个项目占用，打过去会 404）；
#                                 非 compose 服务、非 image 默认，仅为单机落地的真实抓取通道，换机器改下面那一行即可。
#
# api 未起时目标显示 down 属正常; api 起来后同网络 DNS 解析即自动转 up。

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # 环境标签: 单机自托管默认 local; 换环境时改这一个值即可。
  external_labels:
    environment: local

rule_files:
  - /etc/prometheus/alerts-slo.yml

# SLO 告警接收端: alertmanager (compose.observability.yml, v0.27.0)。
# 未起 alertmanager 时本块只是空指针配置 — prometheus 正常启动,
# /api/v1/alerts 照常返回 firing 实例, 只是送不出去 (promtool 也只校验语法)。
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # worker 为可选项: 未随应用栈启动时本目标 down, 不影响其他抓取。
  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9100"]

  # outbox relay 随应用栈部署 (compose.production.yml 的 outbox-relay 服务,
  # #161 核实; 未起应用栈时本目标 down, 不影响其他抓取)。
  - job_name: outbox-relay
    metrics_path: /metrics
    static_configs:
      - targets: ["outbox-relay:9101"]

  # invoice cron 挂在 billing profile (compose.production.yml 的 invoice-cron
  # 服务, FIX-27 的部署入口; 未启用该 profile 时本目标 down, 不影响其他抓取 —
  # 与 worker/outbox-relay 的「可选目标」同一语义)。
  - job_name: invoice-cron
    metrics_path: /metrics
    static_configs:
      - targets: ["invoice-cron:9103"]

  # notify outbox relay 随应用栈部署 (compose.production.yml 的 notify-relay
  # 服务, #16.6-1/K 的部署入口; 未起应用栈时本目标 down, 不影响其他抓取 —
  # 同「可选目标」语义)。暴露 specproof_notify_outbox_pending 等积压 gauge。
  - job_name: notify-relay
    metrics_path: /metrics
    static_configs:
      - targets: ["notify-relay:9102"]

  # rabbitmq 经自带插件 rabbitmq_prometheus 抓取 (#165): 该插件在
  # rabbitmq:4.0-management-alpine 里已随镜像启用 (容器内 rabbitmq-plugins
  # list -e 实测 E* running), 15692 端口存活。观测栈与 phase0 栈共用网络,
  # 服务名直达, 无需端口映射。队列级深度 (带 queue label 的 per-queue 序列)
  # 在 /metrics/per-object 渲染 — 默认 /metrics 是聚合渲染, 没有 per-queue
  # 序列, DLQ/积压告警的 queue 选择器在聚合渲染下匹配不到东西 (两者均实测)。
  # 未起 phase0 栈时本目标 down, 不影响其他抓取。
  - job_name: rabbitmq
    metrics_path: /metrics/per-object
    static_configs:
      - targets: ["rabbitmq:15692"]

  # edge gateway (spring cloud gateway, #1544 边缘网关; management 端口 8090
  # loopback only)。仅「组成可控」时显现：compose.observability.yml 的
  # specproof-edge 服务（build: services/gateway）支持；未组合时本目标 down,
  # 不影响其他抓取。指标经 resilience4j micrometer 绑定 — 本仓 Spring Cloud 侧的
  # emission site 见 services/gateway/.../EdgeCircuitBreakerGatewayFilterFactory。
  - job_name: specproof-edge
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["specproof-edge:8090"]

  # 单机自托管设备（phase0 单机，2026-11-16 实测）：应用栈（api/worker/
  # relay…）都不在 compose 网络里 —— 应用进程跑在宿主机上
  # （`python -m api.server`，绑 0.0.0.0:8000）。
  # 注意：host.docker.internal:8000 在这台机器上指向 127.0.0.1，而 127.0.0.1:8000
  # 被另一个项目（career-os-ai-service，com.docker.backend PID 12868）占用 ——
  # 从容器里打过去返回 404。所以这里钉死的是宿主机局域网 IP：192.168.1.5:8000。
  # 换机器/换 IP 时只需改这里一行；完整应用栈（compose.observability/production）
  # 里就是上面的 api:8000 —— 本目标不替代它，只是单机落地的真实抓取通道。
  - job_name: local-host-api
    metrics_path: /metrics
    static_configs:
      - targets: ["192.168.1.5:8000"]
