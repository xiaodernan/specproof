# Grafana dashboard provisioning: 挂载 infra/grafana/dashboards 下的 SLO 看板 JSON
apiVersion: 1

providers:
  - name: specproof
    orgId: 1
    folder: ""
    type: file
    disableDeletion: true
    updateIntervalSeconds: 10
    allowUIUpdates: true
    options:
      path: /var/lib/grafana/dashboards
