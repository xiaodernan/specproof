name: specproof-nightly-eval

on:
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC daily
  workflow_dispatch:

jobs:
  nightly-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Nightly golden-case evaluation
        run: |
          python -m cli.specproof.main eval \
            --cases golden-cases --repo . --no-llm \
            --output docs/eval/eval-report.html | tee eval-run.log
      - name: Publish eval artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-eval-report
          path: docs/eval/eval-report.html
      - name: Alert on regression (fails the run so the schedule surfaces it)
        run: |
          grep -q "Recall:             100.0%" eval-run.log \
            && grep -q "False positives:    0" eval-run.log \
            || (echo "NIGHTLY EVAL REGRESSION" && exit 1)
