name: specproof-nightly-eval

on:
  schedule:
    - cron: "0 2 * * *"  # 02:00 UTC daily
  workflow_dispatch:

jobs:
  nightly-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SPECPROOF_SANDBOX_M2_VOLUME: specproof-maven-cache-1000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Seed sandbox Maven cache (non-root, --network none)
        # #529: one owner — scripts/seed_maven_cache.sh (the same script
        # ci.yml runs). The #159/#203 exec-bit note and #521's swallowed-
        # comment note live there now, once.
        run: bash scripts/seed_maven_cache.sh
      - name: Materialize every golden-scenario ref from this checkout
        # #521: the refs the nightly evaluation resolves are LOCAL tags built
        # by scripts/build_golden_scenarios.py (a rebuild creates new commits,
        # so they are not pushed); a checkout carries none of them and the eval
        # aborts in its ref preflight. --refs-only tags base at HEAD and
        # rebuilds head-v1 plus all 101 case refs in temporary worktrees,
        # without moving HEAD or dirtying the tree. The 100-case run needs the
        # full set, so no --only here; the binding to this step is
        # tests/unit/test_ci_materializes_the_golden_refs.py.
        run: |
          git config user.name "specproof-ci"
          git config user.email "specproof-ci@users.noreply.github.com"
          python scripts/build_golden_scenarios.py --refs-only
      - name: Nightly 100 golden-case evaluation (multi-hour)
        run: |
          # #222/#224: the recall/false-positive floors the "Alert on regression"
          # step greps for are given to the tool here, so the step fails itself
          # and names the metric instead of the tool reporting PASS (its
          # shipped default pins no floors) beside a grep that contradicts it.
          python -m cli.specproof.main eval \
            --cases golden-cases --repo . --no-llm \
            --gate --min-recall 100 --min-precision 100 --max-false-positives 0 \
            --output docs/eval/eval-report.html | tee eval-run.log
      - name: Publish eval artifact
        uses: actions/upload-artifact@v4
        with:
          name: nightly-eval-report
          # The SIDECAR travels with the page (ledger #421): the HTML is a
          # view of the evidence, and the evidence is the sidecar. A run that
          # fails with "not measured" cases leaves the reason and the failing
          # side's own output IN the sidecar - without it, a failed nightly
          # leaves a page and nothing to diagnose it from.
          # scripts/diagnose_eval_sidecar.py reads exactly these files.
          path: |
            docs/eval/eval-report.html
            docs/eval/eval-report.results.json
            docs/eval/eval-report.results.jsonl
      - name: Alert on regression (fails the run so the schedule surfaces it)
        # Precision joins here for the same reason it joined ci.yml (#230):
        # recall and false positives were asserted while precision was not,
        # so inventing findings on negative cases failed one gate and not the
        # other. Measured 100.0% in every committed segment log.
        run: |
          grep -q "Recall:             100.0%" eval-run.log \
            && grep -q "Precision:          100.0%" eval-run.log \
            && grep -q "False positives:    0" eval-run.log \
            || (echo "NIGHTLY EVAL REGRESSION" && exit 1)
