name: specproof-ci

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  lint-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy (strict)
        run: python -m mypy .

  # The dashboard/Agent UI is a user-facing surface with its own gate suite
  # (tsc + vitest + vite build). Before #507 nothing in the automated path ran
  # them: ruff/mypy/pytest are Python-only, and the local pre-push hook skips
  # the npm build by default — so a broken frontend could sit on master with
  # every job green. The three legs below are the same ones the repo documents.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci
      - name: Typecheck (tsc --noEmit)
        working-directory: apps/web
        run: npm run typecheck
      - name: Unit tests (vitest run)
        working-directory: apps/web
        run: npm run test
      - name: Production build (vite build)
        working-directory: apps/web
        run: npm run build

  # #1546: the Java services were covered by NO job. Measured on 2026-11-09:
  # this workflow had 7 jobs and not one of them ran Maven, so
  # services/control-plane's 9 JUnit tests and services/gateway's main code
  # were never compiled — a broken Java build could sit on master with every
  # job green. That is the same shape #507 found on the frontend.
  #
  # No infrastructure is needed: the control-plane tests run against an
  # in-memory H2 (src/test/resources/application-test.yml) with the outbox
  # relay disabled, so this leg needs neither docker nor a database.
  #
  # The JDK is pinned to 21 because both poms declare <java.version>21</
  # java.version>. The number is not repeated in the gate either — it is read
  # out of the poms by tests/unit/test_ci_runs_the_java_services.py, so the
  # two cannot drift.
  java-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            services/control-plane/pom.xml
            services/gateway/pom.xml
      - name: control-plane (compile + tests)
        working-directory: services/control-plane
        run: mvn -B test
      - name: edge gateway (compile + tests)
        working-directory: services/gateway
        run: mvn -B test

  # §8.1 / §14-4: OpenAPI schema diff gate. The baseline is committed at
  # docs/openapi/baseline.json; intentional API changes must update it in
  # the same PR (scripts/openapi_diff.py --update), everything else fails
  # the job with the added/removed/changed endpoint report.
  openapi-schema-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: OpenAPI schema diff gate
        run: python scripts/openapi_diff.py docs/openapi/baseline.json

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Bandit scan (shipped packages, medium severity and above = zero)
        run: |
          python -m bandit -r agent api cli storage providers evidence \
            observability sandbox experiments integrations -ll -q --skip B101

  tests-no-infra:
    runs-on: ubuntu-latest
    steps:
      # #499: the unit suite judges the LEDGER's history (the fence needs 100
      # revisions of docs/operations/DEEP_OPTIMIZATION_PLAN.md). A depth-1
      # checkout leaves one, and the fence then refuses to certify instead of
      # passing — 7 legs red on every push. The job has to carry the history
      # the gates read.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit + security + fault tests
        run: python -m pytest tests/unit tests/security tests/fault -q

  tests-with-infra:
    runs-on: ubuntu-latest
    # #529: name the volume the runner mounts, so the seeding script and the
    # sandbox read one knob instead of agreeing by matching defaults.
    # #375: the compose services need credentials, and the test harness strips
    # the password variables on purpose (no real credentials in unit
    # tests). The integration legs take the credential through a URL
    # instead — the same shape MYSQL_URL already has.
    env:
      SPECPROOF_SANDBOX_M2_VOLUME: specproof-maven-cache-1000
      REDIS_URL: redis://:specproof_pass@localhost:6379/0  # 一次性 CI runner 的自带脚手架口令：与 compose.phase0.yml redis --requirepass 的出厂默认一致，非生产凭证 # specproof-nosec Redis URL with Credentials
      MYSQL_URL: mysql://specproof:specproof_pass@localhost:3306/specproof_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Start infrastructure
        run: docker compose -f compose.phase0.yml up -d --wait
      - name: Create the isolated test schema (the isolation contract refuses to run without it)
        # #499: tests/conftest.py (#75) refuses to let a session write the
        # product schema, and it only redirects when the ISOLATED schema
        # answers. compose.phase0.yml creates one schema (the product one), so
        # on this runner the session would exit 4 ("blocked") before a single
        # test ran — the whole job's coverage, gone, with a message that
        # pointed at a Windows-only .ps1. These are the same two statements
        # scripts/create_test_database.ps1 runs; the schema name is pinned
        # against the conftest's own default by
        # tests/unit/test_ci_jobs_can_run_the_repo_gates.py.
        run: |
          docker compose -f compose.phase0.yml exec -T \
            -e MYSQL_PWD="${MYSQL_ROOT_PASSWORD:-specproof_root}" mysql \
            mysql -uroot --batch --skip-column-names -e \
            "CREATE DATABASE IF NOT EXISTS specproof_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
             GRANT ALL PRIVILEGES ON specproof_test.* TO 'specproof'@'%';
             FLUSH PRIVILEGES;"
      - name: Seed sandbox Maven cache (non-root, --network none)
        # #529: one owner — scripts/seed_maven_cache.sh. This block, the eval
        # job's copy and nightly's were byte-identical sequences kept in step
        # by hand; the #499 and #521 comment-swallow notes each had to be
        # fixed once per copy. The volume comes from
        # SPECPROOF_SANDBOX_M2_VOLUME, the same knob sandbox/runner.py reads.
        run: bash scripts/seed_maven_cache.sh
      - name: Materialize the golden-scenario refs the eval cases resolve
        # #521: the golden refs are built by scripts/build_golden_scenarios.py
        # and are LOCAL tags — a rebuild creates new commits every time, so a
        # checkout carries only what earlier rebuilds happened to push (origin,
        # measured 2026-10-29: base, head-v1, p0.5-verified-v1 and seven
        # case-*-head tags — none of the four this job evaluates; CI run
        # 40714443058 aborted in the ref preflight naming case-12/17/21/56-
        # head). --refs-only treats THIS checkout as the honest base, moves
        # stale base/head-v1 onto it, rebuilds the selected cases in temporary
        # worktrees, and never moves HEAD or dirties the tree. The list is the
        # union of both evaluating jobs' cases; extras cost seconds, a missing
        # id aborts the eval. The binding is
        # tests/unit/test_ci_materializes_the_golden_refs.py, not this comment.
        run: |
          git config user.name "specproof-ci"
          git config user.email "specproof-ci@users.noreply.github.com"
          python scripts/build_golden_scenarios.py --refs-only \
            --only case-01,case-10,case-12,case-17,case-21,case-56
      - name: Kernel integration tests + the contract CLI cases (real MySQL/Redis/RabbitMQ/Mongo)
        # #499: the contract compiler's CLI cases reach MySQL through
        # ContractRegistry(), so in the no-infra job they skip (the database
        # is not there) — and before this they FAILED there, which is how a
        # job without a database produced two reds. This job has the
        # database, so it runs them for real: the skip must not be the only
        # place those two paths are ever exercised.
        # #600: the aggregate demo plane has the same shape — one leg writes
        # three rows to a live schema and reads the dashboard back, so it now
        # skips without a database and runs here with one. Which files must be
        # on this list is not a remembered set any more:
        # tests/unit/test_the_no_infra_job_holds_its_no_database_promise.py
        # derives it from the #120 census and reds on a file that skips
        # here-absent and runs nowhere.
        # 2026-11-08: the four files #600 disclosed as "runs nowhere"
        # (test_agent_jobs_migration_parity, test_audit_action_parity,
        # test_data_dictionary_covers_migrations, test_feedback_store_read)
        # are now on this list instead — verified green against a live
        # specproof_test here; the #600 roster is emptied rather than worked
        # around, and the gate derives this list again.
        # #521: slow_eval is the FULL 100-case, multi-hour evaluation. Its
        # dedicated home is nightly-eval.yml; this job collected it too, so
        # once the refs above resolve it would rebuild Maven cases for hours
        # on every push. The marker name is bound to the test's own marker by
        # tests/unit/test_ci_materializes_the_golden_refs.py — renaming one
        # without the other reds that gate instead of silently re-running it.
        run: python -m pytest tests/integration tests/unit/test_job_state_machine.py tests/unit/test_outbox.py tests/unit/test_migrations.py tests/unit/test_contract_compiler.py tests/unit/test_the_aggregate_plane_answers_the_demo_question.py tests/unit/test_agent_jobs_migration_parity.py tests/unit/test_audit_action_parity.py tests/unit/test_data_dictionary_covers_migrations.py tests/unit/test_feedback_store_read.py -q -m "not slow_eval"
      - name: Stop infrastructure
        if: always()
        run: docker compose -f compose.phase0.yml down -v

  eval-golden-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SPECPROOF_SANDBOX_M2_VOLUME: specproof-maven-cache-1000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Seed sandbox Maven cache (non-root, --network none)
        # #529: one owner — scripts/seed_maven_cache.sh. This block, the eval
        # job's copy and nightly's were byte-identical sequences kept in step
        # by hand; the #499 and #521 comment-swallow notes each had to be
        # fixed once per copy. The volume comes from
        # SPECPROOF_SANDBOX_M2_VOLUME, the same knob sandbox/runner.py reads.
        run: bash scripts/seed_maven_cache.sh
      - name: Materialize the golden-scenario refs this job evaluates
        # #521: the golden refs are built by scripts/build_golden_scenarios.py
        # and are LOCAL tags — a rebuild creates new commits every time, so
        # even this job's fetch-depth: 0 checkout carries only what earlier
        # rebuilds happened to push (origin, measured 2026-10-29: base,
        # head-v1, p0.5-verified-v1, seven case-*-head tags — and none of the
        # four below). The eval then refused to run, naming the four
        # unresolved refs (run 40714443058) — a setup failure, not a detection
        # result. --refs-only treats THIS checkout as the honest base, moves
        # stale base/head-v1 onto it, rebuilds the selected cases in temporary
        # worktrees, and never moves HEAD or dirties the tree the evaluation
        # reads. The --only list must cover the four cases copied below; that
        # binding is tests/unit/test_ci_materializes_the_golden_refs.py, not
        # this comment.
        run: |
          git config user.name "specproof-ci"
          git config user.email "specproof-ci@users.noreply.github.com"
          python scripts/build_golden_scenarios.py --refs-only \
            --only case-01,case-10,case-12,case-17,case-21,case-56
      - name: Evaluate representative golden-case subset (deterministic)
        run: |
          # #537: a pipeline reports its LAST command's status, and `tee`
          # exits 0 even when the evaluation exits 1 (`--gate` on an
          # INSUFFICIENT/FAIL verdict). Run 41067550985 finished this step
          # green beside "Acceptance: INSUFFICIENT". pipefail makes the step
          # carry the tool's own verdict; the artifact upload below is
          # `if: always()` so a failed run still publishes the sidecar that
          # says why. The binding is
          # tests/unit/test_the_eval_ci_step_cannot_swallow_the_tools_exit.py.
          set -o pipefail
          # The full 100-case eval is a multi-hour gate (local slow_eval /
          # nightly job). CI runs a representative subset: execution-only
          # positive, second-category positive, and a NEGATIVE control.
          #
          # #205: the subset used to copy case-01 and case-10, which
          # `docs/eval/holdout-manifest.json` declares as holdout. Isolation is
          # on by default, so `plan_case_dirs` silently dropped both: the run
          # went from 4 cases to 2, and the case it lost was the only NEGATIVE
          # one — which made the "False positives: 0" gate below vacuously true
          # (zero negative cases means zero false positives, always). Every
          # case here must be non-holdout, and --gate with explicit floors
          # makes a shrunk subset fail loudly instead of quietly passing.
          mkdir -p eval-subset
          cp -r golden-cases/case-21-auth-weakened-permitall eval-subset/
          cp -r golden-cases/case-12-add-javadoc eval-subset/
          cp -r golden-cases/case-17-logic-inversion eval-subset/
          cp -r golden-cases/case-56-redis-cache-eviction-removed eval-subset/
          # #222/#224: the two greps below used to be the ONLY place this
          # contract lived, so `--gate` could print PASS and exit 0 next to
          # "Recall: 66.7%" while the same log failed the grep. The floors are
          # now given to the tool, which fails the step itself naming the
          # metric ("recall 66.7 低于下限 100") instead of "substring missing".
          # The greps stay as an independent second assertion (bound to the
          # tool's own renderer by test_ci_acceptance_greps_match_the_eval_summary).
          python -m cli.specproof.main eval \
            --cases eval-subset --repo . --no-llm \
            --gate --min-recall 100 --min-precision 100 --max-false-positives 0 \
            --min-positive-cases 3 --min-negative-cases 1 \
            --output docs/eval/eval-report.html | tee eval-run.log
      # Quoted: an unquoted scalar cannot contain ": ", and this file failed to
      # parse as YAML because of these two names -- so every push since the file
      # landed produced a 0s "workflow file issue" run and no job ever started.
      - name: "Gate: recall must be 100%"
        run: |
          grep -q "Recall:             100.0%" eval-run.log \
            || (echo "Recall gate FAILED" && exit 1)
      - name: "Gate: precision must be 100%"
        # #230/#35.5-2: precision was the one acceptance number this workflow
        # never asserted -- recall and false positives both had a floor, so a
        # run could invent findings on negative cases and still exit 0. The
        # floor is new; the value is not a guess. All three subset cases were
        # measured at Precision 100.0% / False positives 0 in committed logs
        # (case-01, case-17 in docs/eval/c1-rerun.log; case-56 in c3-rerun.log),
        # and all five 20-case segments covering the full 100 read the same.
        run: |
          grep -q "Precision:          100.0%" eval-run.log \
            || (echo "Precision gate FAILED" && exit 1)
      - name: "Gate: zero false positives"
        run: |
          grep -q "False positives:    0" eval-run.log \
            || (echo "False-positive gate FAILED" && exit 1)
      - name: Upload eval report
        # #537: the eval step now fails on a non-PASS gate verdict, and that
        # failed run is exactly the one whose sidecar must survive the job.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          # The SIDECAR travels with the page (ledger #421): the HTML is a
          # view of the evidence, and the evidence is the sidecar. A run that
          # fails with "not measured" cases leaves the reason and the failing
          # side's own output IN the sidecar - without it, a failed run leaves
          # a page and nothing to diagnose it from.
          # scripts/diagnose_eval_sidecar.py reads exactly these files.
          path: |
            docs/eval/eval-report.html
            docs/eval/eval-report.results.json
            docs/eval/eval-report.results.jsonl

  # ── provider-smoke ─────────────────────────────────────────────────
  # #1549: the one job of the three orphan branches' five that master's name
  # roster never took, and the only leg in this repository that talks to a real
  # model gateway. It is manual on purpose -- the credentials live in a GitHub
  # *environment*, never in the tree, so `secrets.` still appears nowhere else
  # in this file. Every step below is the branch's own (a756f5338:
  # .github/workflows/quality.yml), carried over rather than re-typed: the env
  # names are the ones providers/config.py declares, and a landing written from
  # memory used SPECPROOF_LLM_* -- names nothing in this repository reads, which
  # would have run green-shaped and reported "unconfigured". The bindings (env
  # keys readable, the dispatch gate matching `on:`, environment declared, no
  # secret interpolated into a run: command) are
  # tests/unit/test_the_provider_smoke_ci_leg_carries_the_branch_job.py.
  provider-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: provider-smoke
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Provider Smoke (requires secrets)
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python scripts/provider_smoke.py

