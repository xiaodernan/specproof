name: specproof-ci

on:
  push:
    branches: [main, master, "feature/**"]
  pull_request:

jobs:
  lint-type:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy (strict)
        run: python -m mypy .

  # §8.1 / §14-4: OpenAPI schema diff gate. The baseline is committed at
  # docs/openapi/baseline.json; intentional API changes must update it in
  # the same PR (scripts/openapi_diff.py --update), everything else fails
  # the job with the added/removed/changed endpoint report.
  openapi-schema-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: OpenAPI schema diff gate
        run: python scripts/openapi_diff.py docs/openapi/baseline.json

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Bandit scan (shipped packages, medium severity and above = zero)
        run: |
          python -m bandit -r agent api cli storage providers evidence \
            observability sandbox experiments integrations -ll -q --skip B101

  tests-no-infra:
    runs-on: ubuntu-latest
    steps:
      # #499: the unit suite judges the LEDGER's history (the fence needs 100
      # revisions of docs/operations/DEEP_OPTIMIZATION_PLAN.md). A depth-1
      # checkout leaves one, and the fence then refuses to certify instead of
      # passing — 7 legs red on every push. The job has to carry the history
      # the gates read.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit + security + fault tests
        run: python -m pytest tests/unit tests/security tests/fault -q

  tests-with-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Start infrastructure
        run: docker compose -f compose.phase0.yml up -d --wait
      - name: Create the isolated test schema (the isolation contract refuses to run without it)
        # #499: tests/conftest.py (#75) refuses to let a session write the
        # product schema, and it only redirects when the ISOLATED schema
        # answers. compose.phase0.yml creates one schema (the product one), so
        # on this runner the session would exit 4 ("blocked") before a single
        # test ran — the whole job's coverage, gone, with a message that
        # pointed at a Windows-only .ps1. These are the same two statements
        # scripts/create_test_database.ps1 runs; the schema name is pinned
        # against the conftest's own default by
        # tests/unit/test_ci_jobs_can_run_the_repo_gates.py.
        run: |
          docker compose -f compose.phase0.yml exec -T \
            -e MYSQL_PWD="${MYSQL_ROOT_PASSWORD:-specproof_root}" mysql \
            mysql -uroot --batch --skip-column-names -e \
            "CREATE DATABASE IF NOT EXISTS specproof_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
             GRANT ALL PRIVILEGES ON specproof_test.* TO 'specproof'@'%';
             FLUSH PRIVILEGES;"
      - name: Seed sandbox Maven cache (non-root, --network none)
        run: |
          docker volume create specproof-maven-cache-1000
          # volume root must be uid-1000-owned for the non-root sandbox
          docker run --rm -v specproof-maven-cache-1000:/m2 \
            maven:3.9-eclipse-temurin-21 sh -c "chown -R 1000:1000 /m2"
          # dependencies land in the cache volume (network available here)
          docker run --rm --user 1000:1000 \
            -e MAVEN_USER_HOME=/home/maven/.m2 -e MAVEN_OPTS="-Duser.home=/home/maven" \
            -v specproof-maven-cache-1000:/home/maven/.m2 \
            -v $PWD/demo/spring-backend:/work:ro -w /work \
            maven:3.9-eclipse-temurin-21 mvn -q -DskipTests dependency:go-offline
          # wrapper jar is git-ignored (*.jar); fetch it so mvnw can place
          # the wrapper distribution in the cache volume
          curl -fsSL -o demo/spring-backend/.mvn/wrapper/maven-wrapper.jar \
            https://repo.maven.apache.org/maven2/org/apache/maven/wrapper/maven-wrapper/3.3.2/maven-wrapper-3.3.2.jar
          # #159: CI exit 126 — mvnw is committed 100644 (Windows drops the
          # exec bit), so `./mvnw` cannot exec as the non-root sandbox user.
          # Invoke it through sh, which needs no exec bit.
          # #499: the comment sits ABOVE the command on purpose. Inside a
          # backslash continuation the shell swallows the comment AND the
          # image and command that follow it, so `docker run` was called with
          # no image at all ("docker: 'docker run' requires at least 1
          # argument") and this step killed the job before its tests ran.
          docker run --rm --user 1000:1000 \
            -e MAVEN_USER_HOME=/home/maven/.m2 -e MAVEN_OPTS="-Duser.home=/home/maven" \
            -v specproof-maven-cache-1000:/home/maven/.m2 \
            -v $PWD/demo/spring-backend:/work:ro -w /work \
            maven:3.9-eclipse-temurin-21 sh mvnw -q -v
      - name: Kernel integration tests + the contract CLI cases (real MySQL/Redis/RabbitMQ/Mongo)
        # #499: the contract compiler's CLI cases reach MySQL through
        # ContractRegistry(), so in the no-infra job they skip (the database
        # is not there) — and before this they FAILED there, which is how a
        # job without a database produced two reds. This job has the
        # database, so it runs them for real: the skip must not be the only
        # place those two paths are ever exercised.
        run: python -m pytest tests/integration tests/unit/test_job_state_machine.py tests/unit/test_outbox.py tests/unit/test_migrations.py tests/unit/test_contract_compiler.py -q
      - name: Stop infrastructure
        if: always()
        run: docker compose -f compose.phase0.yml down -v

  eval-golden-cases:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SPECPROOF_SANDBOX_M2_VOLUME: specproof-maven-cache-1000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Seed sandbox Maven cache (non-root, --network none)
        run: |
          docker volume create specproof-maven-cache-1000
          # volume root must be uid-1000-owned for the non-root sandbox
          docker run --rm -v specproof-maven-cache-1000:/m2 \
            maven:3.9-eclipse-temurin-21 sh -c "chown -R 1000:1000 /m2"
          # dependencies land in the cache volume (network available here)
          docker run --rm --user 1000:1000 \
            -e MAVEN_USER_HOME=/home/maven/.m2 -e MAVEN_OPTS="-Duser.home=/home/maven" \
            -v specproof-maven-cache-1000:/home/maven/.m2 \
            -v $PWD/demo/spring-backend:/work:ro -w /work \
            maven:3.9-eclipse-temurin-21 mvn -q -DskipTests dependency:go-offline
          # wrapper jar is git-ignored (*.jar); fetch it so mvnw can place
          # the wrapper distribution in the cache volume
          curl -fsSL -o demo/spring-backend/.mvn/wrapper/maven-wrapper.jar \
            https://repo.maven.apache.org/maven2/org/apache/maven/wrapper/maven-wrapper/3.3.2/maven-wrapper-3.3.2.jar
          # #159: CI exit 126 — mvnw is committed 100644 (Windows drops the
          # exec bit), so `./mvnw` cannot exec as the non-root sandbox user.
          # Invoke it through sh, which needs no exec bit.
          # #499: the comment sits ABOVE the command on purpose. Inside a
          # backslash continuation the shell swallows the comment AND the
          # image and command that follow it, so `docker run` was called with
          # no image at all ("docker: 'docker run' requires at least 1
          # argument") and this step killed the job before its tests ran.
          docker run --rm --user 1000:1000 \
            -e MAVEN_USER_HOME=/home/maven/.m2 -e MAVEN_OPTS="-Duser.home=/home/maven" \
            -v specproof-maven-cache-1000:/home/maven/.m2 \
            -v $PWD/demo/spring-backend:/work:ro -w /work \
            maven:3.9-eclipse-temurin-21 sh mvnw -q -v
      - name: Evaluate representative golden-case subset (deterministic)
        run: |
          # The full 100-case eval is a multi-hour gate (local slow_eval /
          # nightly job). CI runs a representative subset: execution-only
          # positive, second-category positive, and a NEGATIVE control.
          #
          # #205: the subset used to copy case-01 and case-10, which
          # `docs/eval/holdout-manifest.json` declares as holdout. Isolation is
          # on by default, so `plan_case_dirs` silently dropped both: the run
          # went from 4 cases to 2, and the case it lost was the only NEGATIVE
          # one — which made the "False positives: 0" gate below vacuously true
          # (zero negative cases means zero false positives, always). Every
          # case here must be non-holdout, and --gate with explicit floors
          # makes a shrunk subset fail loudly instead of quietly passing.
          mkdir -p eval-subset
          cp -r golden-cases/case-21-auth-weakened-permitall eval-subset/
          cp -r golden-cases/case-12-add-javadoc eval-subset/
          cp -r golden-cases/case-17-logic-inversion eval-subset/
          cp -r golden-cases/case-56-redis-cache-eviction-removed eval-subset/
          # #222/#224: the two greps below used to be the ONLY place this
          # contract lived, so `--gate` could print PASS and exit 0 next to
          # "Recall: 66.7%" while the same log failed the grep. The floors are
          # now given to the tool, which fails the step itself naming the
          # metric ("recall 66.7 低于下限 100") instead of "substring missing".
          # The greps stay as an independent second assertion (bound to the
          # tool's own renderer by test_ci_acceptance_greps_match_the_eval_summary).
          python -m cli.specproof.main eval \
            --cases eval-subset --repo . --no-llm \
            --gate --min-recall 100 --min-precision 100 --max-false-positives 0 \
            --min-positive-cases 3 --min-negative-cases 1 \
            --output docs/eval/eval-report.html | tee eval-run.log
      # Quoted: an unquoted scalar cannot contain ": ", and this file failed to
      # parse as YAML because of these two names -- so every push since the file
      # landed produced a 0s "workflow file issue" run and no job ever started.
      - name: "Gate: recall must be 100%"
        run: |
          grep -q "Recall:             100.0%" eval-run.log \
            || (echo "Recall gate FAILED" && exit 1)
      - name: "Gate: precision must be 100%"
        # #230/#35.5-2: precision was the one acceptance number this workflow
        # never asserted -- recall and false positives both had a floor, so a
        # run could invent findings on negative cases and still exit 0. The
        # floor is new; the value is not a guess. All three subset cases were
        # measured at Precision 100.0% / False positives 0 in committed logs
        # (case-01, case-17 in docs/eval/c1-rerun.log; case-56 in c3-rerun.log),
        # and all five 20-case segments covering the full 100 read the same.
        run: |
          grep -q "Precision:          100.0%" eval-run.log \
            || (echo "Precision gate FAILED" && exit 1)
      - name: "Gate: zero false positives"
        run: |
          grep -q "False positives:    0" eval-run.log \
            || (echo "False-positive gate FAILED" && exit 1)
      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          # The SIDECAR travels with the page (ledger #421): the HTML is a
          # view of the evidence, and the evidence is the sidecar. A run that
          # fails with "not measured" cases leaves the reason and the failing
          # side's own output IN the sidecar - without it, a failed run leaves
          # a page and nothing to diagnose it from.
          # scripts/diagnose_eval_sidecar.py reads exactly these files.
          path: |
            docs/eval/eval-report.html
            docs/eval/eval-report.results.json
            docs/eval/eval-report.results.jsonl
