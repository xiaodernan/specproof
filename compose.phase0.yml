# SpecProof Phase 0 — Minimal Infrastructure
# All containers have health checks and resource limits.
# Start: docker compose -f compose.phase0.yml up -d
# Stop:  docker compose -f compose.phase0.yml down -v

name: specproof-phase0

services:
  mysql:
    image: mysql:8.4
    container_name: specproof-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-specproof_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-specproof_phase0}
      MYSQL_USER: ${MYSQL_USER:-specproof}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-specproof_pass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-specproof_root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  mongodb:
    image: mongo:7.0
    container_name: specproof-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-specproof_phase0}
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-specproof}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-specproof_pass}
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.16.4
    container_name: specproof-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms256m -Xmx512m"
      ELASTIC_PASSWORD: ${ES_PASSWORD:-specproof_pass}
      xpack.security.enabled: "true"
      xpack.security.enrollment.enabled: "false"
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ES_PASSWORD:-specproof_pass} http://localhost:9200/_cluster/health | grep -qE 'green|yellow'"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1G
    ulimits:
      memlock:
        soft: -1
        hard: -1

  redis:
    image: redis:7.4-alpine
    container_name: specproof-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-specproof_pass}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-specproof_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    container_name: specproof-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-specproof}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-specproof_pass}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # S3-compatible object storage. MinIO pulled its community images from every
  # public registry (quay/DockerHub/local pull all measured 401/404 on
  # 2026-10-01, #159b), so the stack runs SeaweedFS: its S3 API server speaks
  # v4 signatures, which is all minio-py (storage/minio.py) needs. The six
  # calls the client uses were verified live against 3.80 — bucket_exists,
  # make_bucket, put_object, stat_object, get_object, list_objects — in both
  # anonymous and credentialed mode; wrong credentials are rejected (S3Error).
  # The service keeps the `minio` name so MINIO_HOST and the app env contract
  # are unchanged. Identity comes from the mounted s3.json (defaults below
  # must move together with MINIO_ROOT_USER/MINIO_ROOT_PASSWORD in
  # compose.production.yml, which generates the same file from the real
  # environment at boot). SeaweedFS ships no S3 console, so the old :9001
  # mapping is gone; the master UI (9333) stays inside the compose network.
  minio:
    image: chrislusf/seaweedfs:3.80
    container_name: specproof-minio
    restart: unless-stopped
    command: >
      server -dir=/data
      -master.volumeSizeLimitMB=1024
      -volume.max=0
      -filer -s3 -s3.port=9000
      -s3.config=/etc/seaweedfs/s3.json
      -ip.bind=0.0.0.0
    ports:
      - "${MINIO_PORT:-9000}:9000"
    volumes:
      - minio-data:/data
      - ./deploy/seaweedfs:/etc/seaweedfs:ro
    healthcheck:
      # busybox nc is in the image (no curl); S3 binds 9000 only after the
      # filer is up, so the start_period absorbs the raft election (~25s
      # measured from container start to "Start Seaweed S3 API Server").
      test: ["CMD-SHELL", "nc -z localhost 9000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M

volumes:
  mysql-data:
  mongodb-data:
  es-data:
  redis-data:
  rabbitmq-data:
  minio-data:
